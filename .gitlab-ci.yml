variables:
  CKSUM_FC_ZERO: 2944420496
  CKSUM_FC_9P_ZERO: e407d4d2
  CKSUM_FC_PAL_ZERO: 4131243774
  CKSUM_VS_ZERO: 306840185
  CKSUM_NSMMAIN_ZERO: 4037760225
  CKSUM_NSMDATA2_ZERO: 1086899374

image: alpine:latest

before_script:
  - echo "@testing https://dl-cdn.alpinelinux.org/alpine/edge/testing" >>/etc/apk/repositories
  - apk add --no-cache make
  - apk add --no-cache plan9port
  - apk add --no-cache --allow-untrusted cc65@testing

build_base:
  stage: build
  needs: []
  script:
    - ./tools/extract.fc_smb.sh
    - ASFLAGS_TGT="-DOG_PAD -DOG_FALL -DFC -DCONS -DSMB -DFC_SMB -DSMBM -DSMBV1" make base
  artifacts:
    untracked: true

test_base:
  stage: test
  needs: ["build_base"]
  script:
    - ASFLAGS_TGT="-DOG_PAD -DOG_FALL -DFC -DCONS -DSMB -DFC_SMB -DSMBM -DSMBV1" CKSUM_FC=$CKSUM_FC_ZERO make check_base

build_base_9p:
  stage: build
  needs: []
  script:
    - export	PATH=/usr/lib/plan9/bin:$PATH
    - rc ./tools/extract.fc_smb.rc
    - mk base 'ASFLAGS_TGT=-DOG_PAD -DOG_FALL -DFC -DCONS -DSMB -DFC_SMB -DSMBM -DSMBV1'
  artifacts:
    untracked: true

test_base_9p:
  stage: test
  needs: ["build_base_9p"]
  script:
    - export	PATH=/usr/lib/plan9/bin:$PATH
    - mk check_base 'ASFLAGS_TGT=-DOG_PAD -DOG_FALL -DFC -DCONS -DSMB -DFC_SMB -DSMBM -DSMBV1' 'CKSUM_FC=$CKSUM_FC_9P_ZERO'

build_pal:
  stage: build
  needs: []
  script:
    - ./tools/extract.fc_smb.sh
    - ASFLAGS_TGT="-DOG_PAD -DOG_FALL -DFC -DCONS -DSMB -DFC_SMB -DSMBM -DSMBV1 -DPAL" make pal
  artifacts:
    untracked: true

test_pal:
  stage: test
  needs: ["build_pal"]
  script:
    - ASFLAGS_TGT="-DOG_PAD -DOG_FALL -DFC -DCONS -DSMB -DFC_SMB -DSMBM -DSMBV1 -DPAL" CKSUM_FC=$CKSUM_FC_PAL_ZERO make check_pal

build_vs:
  stage: build
  needs: []
  script:
    - ./tools/extract.vs.sh
    - ASFLAGS_TGT="-DOG_PAD -DOG_FALL -DVS -DVS_2C04_0004 -DVS_SMB -DSMBV1" make vs
  artifacts:
    untracked: true

test_vs:
  stage: test
  needs: ["build_vs"]
  script:
    - ASFLAGS_TGT="-DOG_PAD -DOG_FALL -DVS -DVS_2C04_0004 -DVS_SMB -DSMBV1" CKSUM_VS=$CKSUM_VS_ZERO make check_vs

build_fds:
  stage: build
  needs: []
  script:
    - ./tools/extract.fds_smb.sh
    - ASFLAGS_TGT="-DOG_PAD -DOG_FALL -DFDS -DCONS -DSMB -DFDS_SMB -DSMBM -DSMBV1" make fds
  artifacts:
    untracked: true

test_fds:
  stage: test
  needs: ["build_fds"]
  script:
    - ASFLAGS_TGT="-DOG_PAD -DOG_FALL -DFDS -DCONS -DSMB -DFDS_SMB -DSMBM -DSMBV1" make check_fds

build_smb2:
  stage: build
  needs: []
  script:
    - ./tools/extract.fds_smb2.sh
    - ASFLAGS_TGT="-DOG_PAD -DOG_FALL -DFDS -DCONS -DSMB2 -DSMBV2" make smb2
  artifacts:
    untracked: true

test_smb2:
  stage: test
  needs: ["build_smb2"]
  script:
    - ASFLAGS_TGT="-DOG_PAD -DOG_FALL -DFDS -DCONS -DSMB2 -DSMBV2" make check_smb2

build_ann:
  stage: build
  needs: []
  script:
    - ./tools/extract.fds_ann.sh
    - ASFLAGS_TGT="-DOG_PAD -DOG_FALL -DFDS -DCONS -DANN -DSMBM -DSMBV2" make ann
  artifacts:
    untracked: true

test_ann:
  stage: test
  needs: ["build_ann"]
  script:
    - ASFLAGS_TGT="-DOG_PAD -DOG_FALL -DFDS -DCONS -DANN -DSMBM -DSMBV2" CKSUM_NSMMAIN=$CKSUM_NSMMAIN_ZERO CKSUM_NSMDATA2=$CKSUM_NSMDATA2_ZERO make check_ann
